name: Build Frontend

on:
  push:
    branches:
      - claude/review-trading-bot-ZMKDp
    paths:
      - 'static/src/**'
      - 'static/package.json'
      - 'static/vite.config.js'
      - 'static/index.html'
  workflow_dispatch:  # allow manual trigger from GitHub Actions UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: static/package-lock.json

      - name: Install dependencies
        working-directory: static
        run: npm install

      - name: Build
        working-directory: static
        run: npm run build

      - name: Commit and push dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f static/dist/
          git diff --staged --quiet && echo "No changes to commit" || (
            git commit -m "Build frontend dist [skip ci]" &&
            git push
          )
